services:
  db-container:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123" ]
      interval: 5s
      timeout: 2s
      retries: 5

  game-transaction-reporter-app:
    build: ./backend
    container_name: game_transaction_reporter_app
    ports:
      - "8080:8080"
    depends_on:
      db-container:
        condition: service_healthy

    develop:
      watch:
        # 1. Instantly sync JSP/Web asset changes without restarting
        - action: sync
          path: ./backend/src/main/webapp
          target: /usr/local/tomcat/webapps/ROOT
        # 2. Rebuild the container automatically if Java code changes
        - action: rebuild
          path: ./backend/src/main/java
        - action: rebuild
          path: ./backend/pom.xml

volumes:
  db_data:
